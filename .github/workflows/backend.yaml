name: Backend

on:
  push:
    branches: [main]
    paths: ['app/src/main/java/com/example/bankflow/backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['app/src/main/java/com/example/bankflow/backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: app/src/main/java/com/example/bankflow/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/src/main/java/com/example/bankflow/backend/package-lock.json

      - run: npm ci

      # Catches syntax errors in every file, including ones no test imports.
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - run: npm test
        env:
          NODE_ENV: test
