name: Release bundle

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name, e.g. 1.0.0'
        required: true
      apiBaseUrl:
        description: 'Production API base URL (https, ends with /)'
        required: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    # Put the four secrets below into a GitHub "release" environment with required reviewers.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BANKFLOW_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed bundle
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          API_BASE_URL: ${{ inputs.apiBaseUrl }}
          BANKFLOW_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BANKFLOW_KEYSTORE_PASSWORD: ${{ secrets.BANKFLOW_KEYSTORE_PASSWORD }}
          BANKFLOW_KEY_ALIAS: ${{ secrets.BANKFLOW_KEY_ALIAS }}
          BANKFLOW_KEY_PASSWORD: ${{ secrets.BANKFLOW_KEY_PASSWORD }}
        run: >
          ./gradlew :app:testDebugUnitTest :app:bundleRelease
          -Pbankflow.versionCode=${{ github.run_number }}
          -Pbankflow.versionName="$VERSION_NAME"
          -Pbankflow.apiBaseUrl="$API_BASE_URL"
          --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # mapping.txt turns obfuscated crash reports back into readable ones. Upload it to Play Console too.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.versionName }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
