name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['app/src/main/java/com/example/bankflow/backend/**', '**.md']
  pull_request:
    paths-ignore: ['app/src/main/java/com/example/bankflow/backend/**', '**.md']
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Git on Windows doesn't record the executable bit.
      - run: chmod +x gradlew

      # Compiles everything (including the Koin graph check), runs the JVM tests, builds the APK.
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests

  # Compose UI tests need an emulator, which is slow, so they run on demand:
  # Actions tab > Android > Run workflow.
  ui-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests
